# Default Configuration for Confidence-Aware Sensor Signal Denoising

data:
  window_size: 256
  hop_size: 128
  target_windows: 6000
  test_size: 0.12
  random_seed: 42
  signal_presence_ratio: 0.65
  noise_sigma: 0.3
  noise_only_sigma: 0.8

model:
  name: "confidence_denoising_1dcnn"
  window_size: 256
  conv_layers:
    - filters: 32
      kernel_size: 9
      activation: "relu"
      pool_size: 2
    - filters: 64
      kernel_size: 7
      activation: "relu"
      pool_size: 2
  shared_dense: 128
  cls_head:
    hidden_dense: 64
    activation: "relu"
    output_units: 1
    output_activation: "sigmoid"
  reg_head:
    output_units: 256
    output_activation: "linear"
  learning_rate: 0.001
  loss_weights:
    reg_out: 1.0
    cls_out: 0.2

training:
  epochs: 25
  batch_size: 64
  verbose: 2
  checkpoint_metric: "val_loss"

online_adaptation:
  base_learning_rate: 0.00001
  adaptation_windows: 200
  print_every: 50

baselines:
  lms:
    mu: 0.001
  nlms:
    mu: 0.1
    eps: 0.000001

evaluation:
  sampling_rate_hz: 1000
  duration_sec: 1.0
  reconstruction_method: "overlap_add"
  metrics:
    - "snr_db"
    - "mse"
    - "rmse"
    - "mae"
