[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confidence-denoising"
version = "1.0.0"
description = "Confidence-aware AI for sensor signal denoising, combining deep learning, adaptive filtering concepts, signal-quality evaluation, and efficient model deployment."
readme = "README.md"
authors = [
    { name = "Ankur Chopde", email = "ankur.1252100020@vit.edu" },
    { name = "Parth Agalave", email = "parth.1252100016@vit.edu" },
    { name = "Saiprasad Kawthe", email = "saiprasad.1252100024@vit.edu" },
    { name = "Archana Ratnaparkhi", email = "archana.ratnaparkhi@vit.edu" },
    { name = "Sagar Janokar", email = "sagar.janokar@vit.edu" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = [
    "sensor-denoising",
    "adaptive-filtering",
    "confidence-aware-ai",
    "1d-cnn",
    "signal-processing",
    "tensorflow-lite",
    "edge-ai",
    "lms-filter"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "pyyaml>=6.0.0",
    "tensorflow>=2.15.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "black>=23.0.0",
    "flake8>=6.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
